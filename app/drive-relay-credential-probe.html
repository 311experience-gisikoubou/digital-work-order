<!doctype html>
<meta charset="utf-8">
<title>DWO relay credential probe</title>
<script>
(() => {
  'use strict';

  const DB_NAME = 'dwo_relay_credential_probe_v1';
  const STORE = 'credentials';

  function b64url(bytes) {
    let s = '';
    for (const b of bytes) s += String.fromCharCode(b);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
  }

  function utf8(value) {
    return new TextEncoder().encode(value);
  }

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE, { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function put(value) {
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(value);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  }

  async function get(id) {
    const db = await openDb();
    const value = await new Promise((resolve, reject) => {
      const req = db.transaction(STORE).objectStore(STORE).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return value;
  }

  async function clear() {
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).clear();
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  }

  async function provision() {
    await clear();

    const hmacRaw = crypto.getRandomValues(new Uint8Array(32));
    const hmacKey = await crypto.subtle.importKey(
      'raw',
      hmacRaw,
      { name: 'HMAC', hash: 'SHA-256' },
      false,
      ['sign']
    );

    const ecdsa = await crypto.subtle.generateKey(
      { name: 'ECDSA', namedCurve: 'P-256' },
      false,
      ['sign', 'verify']
    );
    const ecdsaPublicJwk = await crypto.subtle.exportKey('jwk', ecdsa.publicKey);

    const bearerRaw = crypto.getRandomValues(new Uint8Array(32));
    const bearerToken = b64url(bearerRaw);

    await put({ id: 'hmac', key: hmacKey });
    await put({ id: 'ecdsa-private', key: ecdsa.privateKey });
    await put({ id: 'ecdsa-public', key: ecdsa.publicKey });
    await put({ id: 'bearer', token: bearerToken });

    return {
      hmacServerSecret: b64url(hmacRaw),
      bearerToken,
      ecdsaPublicJwk,
      hmacExtractableAtProvision: hmacKey.extractable,
      ecdsaPrivateExtractableAtProvision: ecdsa.privateKey.extractable
    };
  }

  async function signAfterRestore(canonical) {
    const hmacRecord = await get('hmac');
    const privateRecord = await get('ecdsa-private');
    const bearerRecord = await get('bearer');
    if (!hmacRecord || !privateRecord || !bearerRecord) throw new Error('CREDENTIAL_MISSING');

    let hmacExportBlocked = false;
    let ecdsaExportBlocked = false;
    try { await crypto.subtle.exportKey('raw', hmacRecord.key); } catch (_) { hmacExportBlocked = true; }
    try { await crypto.subtle.exportKey('jwk', privateRecord.key); } catch (_) { ecdsaExportBlocked = true; }

    const hmacSig = new Uint8Array(await crypto.subtle.sign('HMAC', hmacRecord.key, utf8(canonical)));
    const ecdsaSig = new Uint8Array(await crypto.subtle.sign(
      { name: 'ECDSA', hash: 'SHA-256' },
      privateRecord.key,
      utf8(canonical)
    ));

    return {
      bearerToken: bearerRecord.token,
      hmacSignature: b64url(hmacSig),
      ecdsaSignature: b64url(ecdsaSig),
      hmacExtractableAfterRestore: hmacRecord.key.extractable,
      ecdsaPrivateExtractableAfterRestore: privateRecord.key.extractable,
      hmacExportBlocked,
      ecdsaExportBlocked,
      restoredHmacUsages: Array.from(hmacRecord.key.usages),
      restoredEcdsaUsages: Array.from(privateRecord.key.usages)
    };
  }

  window.DwoRelayCredentialProbe = { provision, signAfterRestore, clear };
})();
</script>
